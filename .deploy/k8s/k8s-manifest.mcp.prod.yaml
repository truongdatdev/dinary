---
kind: Service
apiVersion: v1
metadata:
    name: dinary-mcp-prod-svc
spec:
    type: ClusterIP
    selector:
        app: dinary-mcp-prod
    ports:
        - name: http
          protocol: TCP
          port: 80
          targetPort: 3001
        - name: websocket
          protocol: TCP
          port: 3002
          targetPort: 3002

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: dinary-mcp-prod
spec:
    replicas: 2
    selector:
        matchLabels:
            app: dinary-mcp-prod
    template:
        metadata:
            labels:
                app: dinary-mcp-prod
        spec:
            securityContext:
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: dinary-prod-mcp
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      runAsNonRoot: false
                  image: registry.digitalocean.com/ever/dinary-mcp:latest
                  resources:
                      requests:
                          cpu: '50m'
                          memory: '192Mi'
                  env:
                      - name: NODE_ENV
                        value: 'production'
                      - name: MCP_TRANSPORT
                        value: '$MCP_TRANSPORT'
                      - name: MCP_SERVER_MODE
                        value: '$MCP_SERVER_MODE'
                      - name: MCP_HTTP_PORT
                        value: '$MCP_HTTP_PORT'
                      - name: MCP_HTTP_HOST
                        value: '$MCP_HTTP_HOST'
                      - name: MCP_WS_PORT
                        value: '$MCP_WS_PORT'
                      - name: MCP_WS_HOST
                        value: '$MCP_WS_HOST'

                      - name: MCP_CORS_ORIGIN
                        value: '$MCP_CORS_ORIGIN'
                      - name: MCP_CORS_CREDENTIALS
                        value: '$MCP_CORS_CREDENTIALS'

                      - name: MCP_AUTH_ENABLED
                        value: '$MCP_AUTH_ENABLED'
                      - name: MCP_AUTH_BASE_URL
                        value: '$MCP_AUTH_BASE_URL'
                      - name: MCP_AUTH_RESOURCE_URI
                        value: '$MCP_AUTH_RESOURCE_URI'
                      - name: MCP_AUTH_REQUIRED_SCOPES
                        value: '$MCP_AUTH_REQUIRED_SCOPES'
                      - name: MCP_AUTH_SERVERS
                        value: '$MCP_AUTH_SERVERS'
                      - name: MCP_AUTH_JWT_AUDIENCE
                        value: '$MCP_AUTH_JWT_AUDIENCE'
                      - name: MCP_AUTH_JWT_ISSUER
                        value: '$MCP_AUTH_JWT_ISSUER'
                      - name: MCP_AUTH_JWT_ALGORITHMS
                        value: '$MCP_AUTH_JWT_ALGORITHMS'
                      - name: MCP_AUTH_JWT_JWKS_URI
                        value: '$MCP_AUTH_JWT_JWKS_URI'
                      - name: MCP_AUTH_TOKEN_CACHE_TTL
                        value: '$MCP_AUTH_TOKEN_CACHE_TTL'
                      - name: MCP_AUTH_INTROSPECTION_ENDPOINT
                        value: '$MCP_AUTH_INTROSPECTION_ENDPOINT'
                      - name: MCP_AUTH_INTROSPECTION_CLIENT_ID
                        value: '$MCP_AUTH_INTROSPECTION_CLIENT_ID'
                      - name: MCP_AUTH_INTROSPECTION_CLIENT_SECRET
                        value: '$MCP_AUTH_INTROSPECTION_CLIENT_SECRET'
                      - name: MCP_AUTH_METADATA_CACHE_TTL
                        value: '$MCP_AUTH_METADATA_CACHE_TTL'

                      - name: MCP_SESSION_ENABLED
                        value: '$MCP_SESSION_ENABLED'
                      - name: MCP_SESSION_COOKIE_NAME
                        value: '$MCP_SESSION_COOKIE_NAME'
                      - name: MCP_SESSION_TTL
                        value: '$MCP_SESSION_TTL'
                      - name: MCP_AUTH_SESSION_SECRET
                        value: '$MCP_AUTH_SESSION_SECRET'

                      - name: THROTTLE_ENABLED
                        value: '$THROTTLE_ENABLED'
                      - name: THROTTLE_TTL
                        value: '$THROTTLE_TTL'
                      - name: THROTTLE_LIMIT
                        value: '$THROTTLE_LIMIT'

                      - name: API_BASE_URL
                        value: '$API_BASE_URL'
                      - name: DINARY_AUTO_LOGIN
                        value: '$DINARY_AUTO_LOGIN'

                      - name: REDIS_ENABLED
                        value: '$REDIS_ENABLED'
                      - name: REDIS_URL
                        value: '$REDIS_URL'
                      - name: REDIS_HOST
                        value: '$REDIS_HOST'
                      - name: REDIS_PASSWORD
                        value: '$REDIS_PASSWORD'
                      - name: REDIS_PORT
                        value: '$REDIS_PORT'
                      - name: REDIS_USER
                        value: '$REDIS_USER'
                      - name: REDIS_TLS
                        value: '$REDIS_TLS'

                  ports:
                      - containerPort: 3001
                        protocol: TCP
                        name: http
                      - containerPort: 3002
                        protocol: TCP
                        name: websocket

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: dinary-mcp-prod-ing
    annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
        nginx.ingress.kubernetes.io/proxy-body-size: '20m'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
        nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
spec:
    ingressClassName: nginx
    rules:
        - host: mcp.dinary.app
          http:
              paths:
                  - backend:
                        service:
                            name: dinary-mcp-prod-svc
                            port:
                                number: 80
                    path: /
                    pathType: Prefix
    tls:
        - hosts:
              - mcp.dinary.app
          secretName: mcp.dinary.app-tls
