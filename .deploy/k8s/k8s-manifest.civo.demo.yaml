---
kind: Service
apiVersion: v1
metadata:
    name: dinary-demo
spec:
    selector:
        app: dinary-demo-webapp
    ports:
        - name: web
          protocol: TCP
          port: 4200
          targetPort: 4200
---
kind: Service
apiVersion: v1
metadata:
    name: dinary-demo-api
spec:
    selector:
        app: dinary-demo-api
    ports:
        - name: web
          protocol: TCP
          port: 3000
          targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: dinary-demo-api
spec:
    replicas: 1
    selector:
        matchLabels:
            app: dinary-demo-api
    template:
        metadata:
            labels:
                app: dinary-demo-api
        spec:
            securityContext:
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: dinary-demo-api
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      runAsNonRoot: false
                  image: ghcr.io/ordinary-labs/dinary-api-demo:latest
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '672Mi'
                  env:
                      - name: API_HOST
                        value: 0.0.0.0
                      - name: DEMO
                        value: 'true'
                      # Anonymous usage statistics stay off on Dinary's own non-production deployments, so they never count as installations.
                      - name: EVER_STATS_ENABLED
                        value: 'false'
                      - name: NODE_ENV
                        value: 'development'
                      - name: ADMIN_PASSWORD_RESET
                        value: 'true'
                      - name: LOG_LEVEL
                        value: 'info'
                      - name: SENTRY_DSN
                        value: '$SENTRY_DSN'
                      - name: SENTRY_HTTP_TRACING_ENABLED
                        value: '$SENTRY_HTTP_TRACING_ENABLED'
                      - name: SENTRY_PROFILING_ENABLED
                        value: '$SENTRY_PROFILING_ENABLED'
                      - name: SENTRY_POSTGRES_TRACKING_ENABLED
                        value: '$SENTRY_POSTGRES_TRACKING_ENABLED'
                      - name: API_BASE_URL
                        value: 'https://apidemocivo.dinary.app'
                      - name: CLIENT_BASE_URL
                        value: 'https://democivo.dinary.app'
                      # Signing/session secrets: never commit a value here, it is public (GHSA-39j7-x845-4w3c).
                      # Inject real ones from a secret store. Left empty, this DEMO=true API still
                      # falls back to the published defaults in code (held, see resolveSecret in @dinary/config).
                      - name: EXPRESS_SESSION_SECRET
                        value: ''
                      - name: JWT_SECRET
                        value: ''
                      - name: JWT_REFRESH_TOKEN_SECRET
                        value: ''
                      - name: EVER_TEAMS_CLIENT_IP_SECRET
                        value: ''
                      - name: JWT_REFRESH_TOKEN_EXPIRATION_TIME
                        value: '86400'
                      - name: ALLOWED_ORIGINS
                        value: '$ALLOWED_ORIGINS'
                      - name: CLOUD_PROVIDER
                        value: '$CLOUD_PROVIDER'
                      - name: OTEL_ENABLED
                        value: '$OTEL_ENABLED'
                      - name: OTEL_PROVIDER
                        value: '$OTEL_PROVIDER'
                      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                        value: '$OTEL_EXPORTER_OTLP_TRACES_ENDPOINT'
                      - name: OTEL_EXPORTER_OTLP_HEADERS
                        value: '$OTEL_EXPORTER_OTLP_HEADERS'
                  ports:
                      - containerPort: 3000
                        protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: dinary-demo-webapp
spec:
    replicas: 1
    selector:
        matchLabels:
            app: dinary-demo-webapp
    template:
        metadata:
            labels:
                app: dinary-demo-webapp
        spec:
            securityContext:
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: dinary-demo-webapp
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      runAsNonRoot: false
                  image: ghcr.io/ordinary-labs/dinary-webapp-demo:latest
                  resources:
                      requests:
                          cpu: '50m'
                          memory: '64Mi'
                  env:
                      - name: DEMO
                        value: 'true'
                      - name: API_BASE_URL
                        value: 'https://apidemocivo.dinary.app'
                      - name: CLIENT_BASE_URL
                        value: 'https://democivo.dinary.app'
                      - name: SENTRY_DSN
                        value: '$SENTRY_DSN'
                      - name: CHATWOOT_SDK_TOKEN
                        value: '$CHATWOOT_SDK_TOKEN'
                      - name: CLOUDINARY_API_KEY
                        value: '$CLOUDINARY_API_KEY'
                      - name: CLOUDINARY_CLOUD_NAME
                        value: '$CLOUDINARY_CLOUD_NAME'
                      - name: GOOGLE_MAPS_API_KEY
                        value: '$GOOGLE_MAPS_API_KEY'
                      - name: GOOGLE_PLACE_AUTOCOMPLETE
                        value: 'true'
                      - name: DEFAULT_LATITUDE
                        value: '42.6459136'
                      - name: DEFAULT_LONGITUDE
                        value: '23.3332736'
                      - name: DEFAULT_CURRENCY
                        value: 'USD'
                      - name: DINARY_GITHUB_CLIENT_ID
                        value: '$DINARY_GITHUB_CLIENT_ID'
                      - name: DINARY_GITHUB_APP_NAME
                        value: '$DINARY_GITHUB_APP_NAME'
                      - name: DINARY_GITHUB_REDIRECT_URL
                        value: '$DINARY_GITHUB_REDIRECT_URL'
                      - name: DINARY_GITHUB_POST_INSTALL_URL
                        value: '$DINARY_GITHUB_POST_INSTALL_URL'
                      - name: DINARY_GITHUB_APP_ID
                        value: '$DINARY_GITHUB_APP_ID'
                      - name: JITSU_BROWSER_URL
                        value: '$JITSU_BROWSER_URL'
                      - name: JITSU_BROWSER_WRITE_KEY
                        value: '$JITSU_BROWSER_WRITE_KEY'
                  ports:
                      - containerPort: 4200
                        protocol: TCP
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
    name: https-redirect
spec:
    redirectScheme:
        permanent: true
        scheme: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: dinary-demo
    namespace: default
    annotations:
        kubernetes.io/ingress.class: traefik
spec:
    rules:
        - host: democivo.dinary.app
          http:
              paths:
                  - backend:
                        service:
                            name: dinary-demo
                            port:
                                number: 4200
                    path: /
                    pathType: Prefix
    tls:
        - hosts:
              - democivo.dinary.app
          secretName: democivo.dinary.app-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: dinary-demo-api
    namespace: default
    annotations:
        kubernetes.io/ingress.class: traefik
spec:
    rules:
        - host: apidemocivo.dinary.app
          http:
              paths:
                  - backend:
                        service:
                            name: dinary-demo-api
                            port:
                                number: 3000
                    path: /
                    pathType: Prefix
    tls:
        - hosts:
              - apidemocivo.dinary.app
          secretName: apidemocivo.dinary.app-tls
