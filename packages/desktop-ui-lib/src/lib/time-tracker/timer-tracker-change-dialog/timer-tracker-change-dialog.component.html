<form [formGroup]="form" (ngSubmit)="applyChanges()">
	<nb-card [class.large]="expanded$ | async">
		<nb-card-header class="d-flex flex-column">
			<span class="cancel"><i class="fas fa-times" (click)="dismiss()"></i></span>
			<h5 class="title">{{ 'Update' | translate }}</h5>
		</nb-card-header>
		<nb-card-body class="selector-container">
			<!-- Client selector -->
			<dinary-client-selector formControlName="clientId" class="selector"></dinary-client-selector>
			<ngx-error-message class="full-width" [field]="form.get('clientId')"></ngx-error-message>

			<!-- Project selector -->
			<dinary-project-selector formControlName="projectId" class="selector"></dinary-project-selector>
			<ngx-error-message class="full-width" [field]="form.get('projectId')"></ngx-error-message>

			<!-- Team selector -->
			<dinary-team-selector formControlName="teamId" class="selector"></dinary-team-selector>

			<!-- Task selector -->
			<dinary-task-selector formControlName="taskId" class="selector"></dinary-task-selector>
			<ngx-error-message class="full-width" [field]="form.get('taskId')"></ngx-error-message>

			<!-- Note -->
			<dinary-note formControlName="note" class="selector"></dinary-note>
			<ngx-error-message class="full-width" [field]="form.get('note')"></ngx-error-message>
		</nb-card-body>
		<nb-card-footer class="footer">
			<button status="basic" type="button" size="small" outline (click)="dismiss()" nbButton>
				{{ 'BUTTONS.CANCEL' | translate }}
			</button>
			<button
				[disabled]="(isRestarting$ | async) || form.invalid"
				status="success"
				size="small"
				type="submit"
				nbButton
			>
				{{ 'BUTTONS.APPLY' | translate }}
				<nb-icon [style.display]="'none'" *dinarySpinnerButton="isRestarting$ | async"></nb-icon>
			</button>
		</nb-card-footer>
	</nb-card>
</form>
