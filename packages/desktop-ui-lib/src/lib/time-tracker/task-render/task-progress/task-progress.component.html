<div class="row">
  <div class="col-12 mb-1">
    <dinary-task-estimate
      #taskEstimate
      [task$]="task$"
    ></dinary-task-estimate>
  </div>
  @if (!!(task$ | async)?.dueDate) {
    <div class="col-12 mb-1">
      <dinary-task-due-date
        [dueDate]="$safeNavigationMigration((task$ | async)?.dueDate)"
      ></dinary-task-due-date>
    </div>
  }
  <div class="col-12 custom-progress-container">
    <nb-progress-bar
      [displayValue]="true"
      [status]="progressStatus((progress$ | async) || 0)"
      [value]="(progress$ | async) || 0"
      class="custom-progress w-100"
      size="tiny"
      >
    </nb-progress-bar>
  </div>
</div>
