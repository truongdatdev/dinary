<div class="selector-container">
  <!-- Edit clickable icon -->
  @if (isShowEdit$ | async) {
    <nb-icon class="edit" (click)="onChange($event)" icon="edit-2-outline"></nb-icon>
  }
  <!-- Client selector -->
  <dinary-client-selector class="selector"></dinary-client-selector>

  <!-- Project selector -->
  <dinary-project-selector class="selector"></dinary-project-selector>

  <!-- Team selector -->
  @if (isShowTeamSelector$ | async) {
    <dinary-team-selector class="selector"></dinary-team-selector>
  }

  <!-- Task selector -->
  @if (isShowTaskSelector$ | async) {
    <dinary-task-selector class="selector"></dinary-task-selector>
  }

  <!-- Note -->
  <dinary-note class="selector"></dinary-note>
</div>
