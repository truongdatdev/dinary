# Mirror desktop-app installers from GitHub Releases into the R2 bucket behind downloads.dinary.app.
#
# The download links on dinary.app used to point at ever.sfo3.cdn.digitaloceanspaces.com, which died
# with the DigitalOcean account and left every desktop download broken. GitHub Releases stays the
# source of truth and the auto-update feed; R2 is a CDN mirror in front of it.
#
# This runs on a schedule rather than hooking the release workflows: it is self-healing (a missed or
# failed run is corrected by the next one), it touches none of the ~24 existing desktop build
# workflows, and it is idempotent -- an asset already present at the right size is skipped.
#
# Until the R2 bucket exists the scheduled run is a no-op: its first step reports the missing secrets
# as a notice and skips the upload, so an unprovisioned bucket does not fail six times a day.
name: mirror-releases-to-r2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be uploaded without uploading'
        type: boolean
        default: false
  schedule:
    # Every 6 hours. Releases are cut far less often than this, so the window between a release
    # being published and being mirrored is bounded -- and until it is mirrored the website keeps
    # linking to GitHub, because it only rewrites URLs listed in manifest.json.
    - cron: '0 */6 * * *'

concurrency:
  # Two concurrent mirrors would race on manifest.json and could publish one that omits keys the
  # other just uploaded.
  group: mirror-releases-to-r2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # GitHub-hosted on purpose, and the one job in this repo that is.
    #
    # The self-hosted ARC runners CANNOT REACH CLOUDFLARE R2. Measured from inside a running
    # ever-k8s-linux-x64-4 runner pod on 2026-08-30:
    #
    #   https://<account>.r2.cloudflarestorage.com   000  (connection timed out)
    #   https://downloads.dinary.app                    000  (connection timed out)
    #   https://api.github.com                       200
    #   https://registry-1.docker.io/v2/             401  (reachable)
    #   https://cloudflare.com                       301  (reachable)
    #
    # Forcing IPv4 does not help, so it is not the usual AAAA-first problem: it is the ISP-level
    # blackhole of certain Cloudflare anycast prefixes that this fleet has hit before -- the same
    # fault that forced cdn.dinary.app to be terminated in-cluster. The destinations are reachable
    # from outside the homelab, so a GitHub-hosted runner works.
    #
    # This is a deliberate, narrow exception to the self-hosted-only convention: the entire purpose
    # of this job is to talk to Cloudflare, which a self-hosted runner structurally cannot do.
    # dinary is a public repository, so GitHub-hosted minutes are free.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Check whether R2 is configured
        id: config
        # The bucket behind downloads.dinary.app is not provisioned yet, so the four secrets are
        # empty and the mirror can only report "missing env". Failing every 6 hours turns that
        # known gap into six red emails a day and buries real failures. Report it as a notice and
        # skip the upload steps instead; the next scheduled run picks the mirror up on its own as
        # soon as the secrets exist, so nothing here needs a follow-up commit.
        #
        # A configuration that EXISTS but is wrong still fails loudly in the selftest step below.
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=()
          for name in R2_BUCKET R2_S3_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing+=("${name}"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice title=R2 mirror skipped::R2 is not configured yet - no upload attempted. Missing secret(s): ${missing[*]}."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify R2 credentials and signing
        # Runs before any mirroring. R2 answers "signature rejected" in a way the mirror reads as
        # "object absent", so without this a credential or signing fault would look like an empty
        # mirror and publish an empty manifest instead of failing.
        if: steps.config.outputs.configured == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/mirror-releases-to-r2.mjs --selftest

      - name: Mirror release assets to R2
        if: steps.config.outputs.configured == 'true'
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The release repos are public, so this only needs to lift the unauthenticated API rate
          # limit -- it is not granting cross-repo access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: node scripts/mirror-releases-to-r2.mjs
