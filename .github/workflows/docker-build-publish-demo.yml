name: Build and Publish Docker Images Demo

on:
  # Build + publish AFTER the "Release Demo" workflow bumps the version and creates the tag/release,
  # so images are tagged with that exact release version (v111.2.10, ...) instead of :latest.
  workflow_run:
    workflows: ["Release Demo"]
    types: [completed]

concurrency:
  # One group PER WORKFLOW (never a group shared across the six non-prod image builds:
  # that shared `dinary-docker-build` group did not queue them, it STARVED them — GitHub
  # keeps exactly one pending run per group, so an unrelated workflow's run cancelled
  # whichever run was waiting, and environments silently kept serving their old image).
  #
  # Within this workflow the newest commit wins, matching the prod image builds. The
  # trade-off is deliberate: an intermediate version tag can end up without an image,
  # which is inert here because demo/stage deploy from `:latest` and only the release
  # that actually ships needs its own tagged image. The alternative — letting a
  # superseded build run for three hours on a fleet where one install takes 2-3 h —
  # delays the image that IS wanted by exactly that long.
  group: dinary-docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege scope for the automatic GITHUB_TOKEN.
# `packages: write` is required: these jobs log in to ghcr.io with GITHUB_TOKEN and push
# image tags + the :buildcache layer cache. Everything else stays read-only.
permissions:
  contents: read
  packages: write

# docker/build-push-action uploads a build record artifact and a job summary for every build.
# The record holds every build-arg value in plain text, and on a public repo anyone signed in to
# GitHub can download it, so neither is produced. (BuildKit `secrets:` are never recorded.)
env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  dinary-api:
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || 'ubuntu-24.04' }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 300
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: relver
        run: |
          # Version shown in the app footer. Resolution order:
          #   1. a tag pointing AT this exact commit  -> "v111.32.3"      (a real release)
          #   2. otherwise `git describe --long`       -> "v111.32.3-4-gbb20466"
          #      i.e. 4 commits after v111.32.3, at bb20466 — unambiguous, and it can never be
          #      mistaken for the release itself.
          #   3. no tags reachable at all             -> "" (footer falls back to the commit)
          #
          # 🛑 Do NOT use a bare `git describe --abbrev=0` fallback here. It prints the nearest
          # ancestor tag with nothing to mark the distance, so an untagged build renders as if it
          # WERE that release. That is what made web and api look like two different versions
          # (v111.32.2 vs v111.32.3) while they were simply mid-roll on adjacent commits.
          VERSION=$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -1)
          if [ -z "$VERSION" ]; then VERSION=$(git describe --tags --long 2>/dev/null || echo ""); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION:-<none>}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR BEFORE the build so buildx can PUSH the mode=max layer cache to the
      # :buildcache tag (cache-to needs registry auth at build time).
      - name: Login to GitHub Container Registry (build cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.deploy/api/Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/truongdatdev/dinary-api-demo:latest
            ghcr.io/truongdatdev/dinary-api-demo:${{ steps.relver.outputs.version }}
            dinary/dinary-api-demo:latest
            registry.digitalocean.com/ever/dinary-api-demo:latest
          # mode=max caches ALL stages (incl. the multi-minute yarn-install layers) to a dedicated
          # :buildcache tag; every ephemeral runner restores it → no more fully-cold rebuilds.
          # Needs the default docker-container buildx driver — the classic `docker` driver only
          # supports inline (final-stage) cache, which is why the yarn-install stages were cold.
          cache-from: |
            type=registry,ref=ghcr.io/truongdatdev/dinary-api-demo:buildcache
            type=registry,ref=ghcr.io/truongdatdev/dinary-api-demo:latest
          cache-to: type=registry,ref=ghcr.io/truongdatdev/dinary-api-demo:buildcache,mode=min
          build-args: |
            NODE_ENV=development
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            DEMO=true
            NX_BRANCH=${{ github.ref_name }}
            DINARY_APP_VERSION=${{ steps.relver.outputs.version }}
            DINARY_APP_COMMIT=${{ github.event.workflow_run.head_sha }}
          # VERDACCIO_TOKEN / NX_CLOUD_ACCESS_TOKEN are BuildKit build secrets (mounted
          # per-RUN, never embedded in image layers) — see the Dockerfile header.
          secrets: |
            VERDACCIO_TOKEN=${{ secrets.VERDACCIO_TOKEN }}
            NX_CLOUD_ACCESS_TOKEN=${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Docker images list
        run: |
          sudo docker image list

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub Registry
        run: |
          for attempt in 1 2 3 4 5; do
            docker push dinary/dinary-api-demo:latest && break
            [ "$attempt" = 5 ] && exit 1
            echo "::warning::docker push dinary/dinary-api-demo:latest failed (attempt $attempt of 5), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done

      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: doctl registry login --expiry-seconds 3600

      - name: Push to DigitalOcean Registry
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          for attempt in 1 2 3 4 5; do
            docker push registry.digitalocean.com/ever/dinary-api-demo:latest && break
            [ "$attempt" = 5 ] && exit 1
            echo "::warning::docker push registry.digitalocean.com/ever/dinary-api-demo:latest failed (attempt $attempt of 5), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Github Registry
        run: |
          for attempt in 1 2 3 4 5; do
            docker push ghcr.io/truongdatdev/dinary-api-demo:latest && break
            [ "$attempt" = 5 ] && exit 1
            echo "::warning::docker push ghcr.io/truongdatdev/dinary-api-demo:latest failed (attempt $attempt of 5), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          for attempt in 1 2 3 4 5; do
            docker push ghcr.io/truongdatdev/dinary-api-demo:${{ steps.relver.outputs.version }} && break
            [ "$attempt" = 5 ] && exit 1
            echo "::warning::docker push ghcr.io/truongdatdev/dinary-api-demo:${{ steps.relver.outputs.version }} failed (attempt $attempt of 5), retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done

    #   - name: Login to CW Container Registry
    #    uses: docker/login-action@v4
    #    with:
    #      registry: ${{ secrets.CW_DOCKER_REGISTRY }}
    #      username: ${{ secrets.CW_DOCKER_USER }}
    #      password: ${{ secrets.CW_DOCKER_USER_PASSWORD }}

    #   - name: Push to CW Registry
    #    run: |
    #      docker push ${{ secrets.CW_DOCKER_REGISTRY }}/truongdatdev/dinary-api-demo:latest

