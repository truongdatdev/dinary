name: Close stale uptime alerts

# One-off cleanup. The external uptime monitor used to run on a schedule before the monitored
# hosts (dinary.app and its subdomains) existed, so it left a false "production is down" alert
# open. This workflow closes that alert. It is removed in the next commit.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close open uptime-alert issues
    runs-on: ubuntu-24.04
    steps:
      - name: Close them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_LABEL: uptime-alert
        run: |
          set -euo pipefail
          if ! NUMBERS=$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${ALERT_LABEL}" \
                            --state open --limit 100 --json number --jq '.[].number'); then
            echo "::error::Could not list open ${ALERT_LABEL} issues."
            exit 1
          fi
          if [ -z "${NUMBERS}" ]; then
            echo "No open ${ALERT_LABEL} issue."
            exit 0
          fi
          for NUM in ${NUMBERS}; do
            echo "Closing #${NUM}"
            gh issue comment "${NUM}" --repo "${GITHUB_REPOSITORY}" \
              --body "The external uptime monitor has been disabled: the monitored hosts (dinary.app and its subdomains) are not deployed yet, so this alert was a false positive. The workflow keeps its manual \`workflow_dispatch\` trigger and can be switched back on after the deployment exists." \
              || echo "::warning::Comment on #${NUM} failed; closing anyway."
            gh issue close "${NUM}" --repo "${GITHUB_REPOSITORY}" --reason "not planned"
          done
